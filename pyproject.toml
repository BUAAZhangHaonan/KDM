[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdm-research"
version = "0.1.0"
description = "Reference-conditioned abstention analysis for contrastive decoding"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9", "requests>=2.31"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "pandas>=2", "pyarrow>=14", "PyMuPDF>=1.23"]

[project.scripts]
kdm = "kdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
