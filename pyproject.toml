[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kdm-research"
version = "0.1.0"
description = "Reference-conditioned abstention analysis for contrastive decoding"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pillow>=9", "requests>=2.31"]
[project.optional-dependencies]
test = ["pytest>=7", "matplotlib>=3.7", "pandas>=2", "PyMuPDF>=1.23"]
[project.scripts]
kdm = "kdm.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
